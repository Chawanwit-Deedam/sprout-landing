# Netlify configuration
# --------------------------------------------------------------------
# Deploys are driven by GitHub Actions (.github/workflows/deploy.yml):
#   push to main  -> production deploy
#   pull request  -> deploy preview (URL posted as a PR comment)
# Security headers are defined in the "_headers" file at the site root.

[build]
  publish = "."
  # Static site — no build step needed.
  command = ""

[[redirects]]
  # Friendly SPA-style fallback is not needed (single page), but this keeps
  # unknown paths on the site instead of a bare 404 host page.
  from = "/*"
  to = "/index.html"
  status = 200
